[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eact-latex"
version = "0.1.0"
description = "Convert LaTeX or EactMaker markup into CASIO eActivity (.g2e) files for fx-9750GIII / fx-9860G calculators, and back to LaTeX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
eact = "eact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eact = ["data/*.json"]
